# @Description : 本地/单机编排（app + MySQL + Redis，可选 Kafka）
# 用法：
#   docker compose up -d                 # app + mysql + redis
#   docker compose --profile full up -d  # 追加单机 Kafka（KRaft）
#   docker compose logs -f app
#   curl http://localhost:8080/api/sample/monitor/readyz

services:
  app:
    build: .
    image: fastsample:latest
    environment:
      HTTP_API_LISTEN_HOST: 0.0.0.0
      # MySQL（环境变量别名见 src/settings.py AppSettings）
      FASTSAMPLE_DATABASE_HOST: mysql
      FASTSAMPLE_DATABASE_PORT: "3306"
      FASTSAMPLE_DATABASE_USER: root
      FASTSAMPLE_DATABASE_PASSWORD: fastsample
      FASTSAMPLE_DATABASE_NAME: FastSample
      # Redis 单连接模式（禁用 pyproject 中的哨兵配置）
      FS_REDIS_HOST: redis
      FS_REDIS_PORT: "6379"
      FS_REDIS_SENTINEL_SERVICE: none
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: fastsample
      MYSQL_DATABASE: FastSample
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pfastsample"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # 可选：单机 Kafka（KRaft 模式，无需 ZooKeeper）
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

volumes:
  mysql_data:
  redis_data:
