name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # 与本地开发环境保持同一版本，避免规则漂移
        run: pip install ruff==0.16.6

      - name: Run ruff
        run: ruff check src test main.py setup.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # aiosqlite 用于用户体系与资源模块的 SQLite 内存库单元测试
        run: pip install -r requirements.txt aiosqlite

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          status=0
          for f in test/unit/test_*.py; do
            echo "::group::$f"
            python "$f" || status=1
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Unit tests failed"
          fi
          exit $status
