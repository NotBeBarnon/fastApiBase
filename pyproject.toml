[project]
name = "fast-sample"
version = "2.0.0"
description = "FastAPI 示例项目"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 基础
    "loguru>=0.7.2",
    "arrow>=1.3.0",
    "python-dotenv>=1.0.1",
    "tomlkit>=0.13.2",
    "aiohttp>=3.10.10",
    "construct>=2.10.70",
    "apscheduler>=3.10.4",

    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "anyio>=4.6.0",
    "orjson>=3.10.7",

    # Pydantic v2
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",

    # ORM (asyncmy 是 3.12 下 aiomysql 的替代，有 wheel)
    "tortoise-orm[asyncmy]>=0.21.7",

    # HTTP 客户端
    "httpx>=0.27.2",

    # Redis（aioredis 已并入 redis>=4.2）
    "redis>=5.1.1",

    # Kafka
    "aiokafka>=0.11.0",

    # CLI
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "aerich>=0.7.2",
    "ruff>=0.6.9",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]
build = [
    "cx_Freeze>=7.2.3",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
version_files = [
    "src/version.py:VERSION",
]
tag_format = "$version-sample"
use_shortcuts = true
update_changelog_on_bump = true
annotated_tag = true

[tool.aerich]
tortoise_orm = "src.settings.DATABASE_CONFIG"
location = "./migrations"
src_folder = "./."

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: FastAPI 惯例，Depends()/Default() 作为参数默认值
ignore = ["E501", "B008"]

[myproject]
LOG_LEVEL = "debug"
#DEV = true
[myproject.database]
minsize = 24
maxsize = 26

[myproject.redis]
retry_interval = 10
host = "124.223.5.168"
port = 6379
db = 0
user = ""
password = ""
namespace = "FastSample"

[myproject.redis.more_config]
max_connections = 10
socket_timeout = 1

[myproject.redis.sentinels]
service = [["124.223.5.168", 6379], ]
service_name = "mymaster"

[myproject.mq]
bootstrap_servers = ["localhost:9092"]
user = ""
password = ""
retry_interval = 5
num_partitions = 1
replication_factor = 3
[myproject.mq.topic_configs]
"min.insync.replicas" = 2

[myproject.mq.topics]
[myproject.mq.topics.consumer]
fast_sample = "FAST_SAMPLE"
[myproject.mq.topics.producer]
fast_sample = "FAST_SAMPLE"

[myproject.security]
auth_enabled = true
jwt_secret = "fast-sample-secret-change-me"
jwt_algorithm = "HS256"
jwt_expire_seconds = 3600

[myproject.security.api_keys.admin]
key = "fs-admin-key-123456"
role = "admin"

[myproject.security.api_keys.demo]
key = "fs-demo-key-654321"
role = "user"

[myproject.security.rate_limit]
enabled = true
times = 30
window_seconds = 60
key_prefix = "rate_limit"

[myproject.llm]
default_provider = ""
fallback_providers = []
global_timeout = 60
enable_cost_tracking = true

